<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookStore Neo</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --neon-cyan: #06b6d4;
      --neon-pink: #ec4899;
      --neon-green: #10b981;
    }
    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hidden { display: none !important; }
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 25px;
    }
    .auth-box {
      width: 100%;
      max-width: 400px;
      margin-top: 50px;
    }
    .input-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      margin-bottom: 5px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .input-group input {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 10px;
      border-radius: 6px;
    }
    .password-wrapper {
      display: flex;
      gap: 5px;
    }
    .password-wrapper input { flex: 1; }
    .toggle-password {
      background: none;
      border: 1px solid var(--glass-border);
      color: white;
      cursor: pointer;
      border-radius: 6px;
      padding: 0 10px;
    }
    .btn-auth, .btn-card {
      background: var(--neon-cyan);
      color: black;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .auth-switch {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 15px;
    }
    .auth-switch a { color: var(--neon-cyan); text-decoration: none; }
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    #booksContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }
    .book-card { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .book-cover { width: 100%; height: 260px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>

  <div id="auth-section">
    <div id="login-box" class="auth-box glass">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm">
        <div class="input-group">
          <label>Correo Electrónico</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" required>
            <button type="button" class="toggle-password" data-target="loginPassword">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn-auth">Ingresar</button>
      </form>
      <p class="auth-switch">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate aquí</a></p>
    </div>

    <div id="register-box" class="auth-box glass hidden">
      <h2>Crear Cuenta</h2>
      <form id="registerForm">
        <div class="input-group">
          <label>Correo Electrónico</label>
          <input type="email" id="registerEmail" required>
        </div>
        <div class="input-group">
          <label>Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="registerPassword" required>
            <button type="button" class="toggle-password" data-target="registerPassword">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn-auth">Registrarse</button>
      </form>
      <p class="auth-switch">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión aquí</a></p>
    </div>
  </div>

  <div id="app-content" class="hidden" style="width:100%; max-width:1200px;">
    <header>
      <h1 id="userGreeting">Hola</h1>
      <div>
        <button id="viewCartBtn" style="background:var(--neon-green); border:none; padding:10px 15px; border-radius:6px; cursor:pointer; font-weight:bold;">🛒 Carrito (<span id="cartCount">0</span>)</button>
        <button id="logoutBtn" style="background:var(--neon-pink); border:none; padding:10px 15px; border-radius:6px; cursor:pointer; font-weight:bold; color:white; margin-left:10px;">Salir</button>
      </div>
    </header>

    <div id="search-wrapper" style="margin-bottom: 20px;">
      <input type="text" id="bookSearchInput" placeholder="Buscar por título o autor..." style="width:100%; padding:12px; border-radius:6px; border:1px solid var(--glass-border); background:rgba(0,0,0,0.3); color:white;">
    </div>

    <div id="booksContainer"></div>
    <p id="noResultsMessage" class="hidden" style="color:var(--text-muted); text-align:center; margin-top:4px;">No se encontraron libros.</p>

    <div id="admin-section" class="glass hidden" style="margin-top:4px;">
      <h2 id="formTitleHeader">➕ Agregar Nuevo Libro</h2>
      <form id="adminBookForm">
        <input type="hidden" id="adminBookId">
        <div class="input-group"><label>Título</label><input type="text" id="adminTitle" required></div>
        <div class="input-group"><label>Autor</label><input type="text" id="adminAuthor" required></div>
        <div class="input-group">
          <label>Categoría</label>
          <select id="adminCategory" style="padding:10px; background:black; color:white; border-radius:6px;">
            <option value="Ingeniería">Ingeniería</option>
            <option value="Fantasía">Fantasía</option>
            <option value="Educación">Educación</option>
          </select>
        </div>
        <div class="input-group"><label>Precio (Q)</label><input type="number" step="0.01" id="adminPrice" required></div>
        <div class="input-group"><label>URL Imagen</label><input type="text" id="adminImage"></div>
        <div class="input-group"><label>Enlace de Lectura</label><input type="text" id="adminLink"></div>
        <div class="input-group">
          <label>Etiqueta</label>
          <select id="adminBadge" style="padding:10px; background:black; color:white; border-radius:6px;">
            <option value="Ninguno">Ninguno</option>
            <option value="Tendencia">Tendencia</option>
            <option value="Premium">Premium</option>
          </select>
        </div>
        <button type="submit" id="btnSubmitBook" class="btn-auth">Publicar Libro</button>
        <button type="button" id="btnCancelEdit" class="btn-auth hidden" style="background:gray;">Cancelar</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
