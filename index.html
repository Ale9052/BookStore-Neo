<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BookStore Neo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo" onclick="regresarAlCatalogo()" style="cursor:pointer;">BookStore.</div>
        <nav id="header-controls">
            <button id="cartBtn" onclick="abrirVistaCarrito()"><i class="fas fa-shopping-cart"></i> (<span id="cartCount">0</span>)</button>
            <button id="logoutBtn" onclick="localStorage.clear(); location.reload();">Salir</button>
        </nav>
    </header>

    <main>
        <section id="auth-section">
            <div id="login-box">
                <input type="password" id="loginPassword" placeholder="Contraseña">
                <button type="button" onclick="togglePasswordVisibility('loginPassword', this)"><i class="fas fa-eye"></i></button>
                <button onclick="loginUser()">Iniciar Sesión</button>
            </div>
        </section>

        <section id="app-content" class="hidden">
            <div id="customer-view">
                <div id="booksContainer"></div>
            </div>
            <div id="cart-view" class="hidden">
                <h2>Tu Carrito de Compras</h2>
                <div id="cartFullItemsList"></div>
                <div id="summaryTotal">Total: Q0.00</div>
                <button onclick="procesarCompraFinal()">Proceder al Pago Seguro</button>
                <button onclick="regresarAlCatalogo()">Volver</button>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
